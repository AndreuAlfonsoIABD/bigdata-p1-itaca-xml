services:
  mongo:
    image: mongo:7
    container_name: bigdata-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - bigdata-net

  mongo-express:
    image: mongo-express:1
    container_name: bigdata-mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
    depends_on:
      - mongo
    networks:
      - bigdata-net

  neo4j:
    image: neo4j:5
    container_name: bigdata-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Define NEO4J_PASSWORD in .env}
    volumes:
      - neo4j-data:/data
    networks:
      - bigdata-net

volumes:
  mongo-data:
  neo4j-data:

networks:
  bigdata-net:
    driver: bridge
